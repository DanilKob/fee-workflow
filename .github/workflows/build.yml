# The same gate as locally: every unit test, then the integration tests and Cucumber scenarios
# against real Postgres and Restate in Testcontainers (the hosted runner has Docker).
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit and integration tests
        run: ./mvnw -B verify
